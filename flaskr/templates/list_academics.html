{% extends 'base.html' %}

{% block title %}List of Academics{% endblock %}

{% block content %}
<h2 style="text-align:center; margin-bottom: 30px;">Academics List</h2>

<div class="academic-list">
    {% for academic in academics %}
        <a href="{{ url_for('academic_details', academic_id=academic['academic_id']) }}" class="btn">
            {{ academic['academic_year'] }}
        </a>
    {% endfor %}
</div>

<style>
.academic-list {
    margin-top: 30px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}
.academic-list .btn {
    margin: 10px;
    padding: 12px 22px;
    background-color: #337ab7;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    transition: background-color 0.3s ease;
    font-weight: bold;
}
.academic-list .btn:hover {
    background-color: #286090;
}
</style>
{% endblock %}
