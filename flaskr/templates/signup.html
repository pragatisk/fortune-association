{% extends 'base.html' %}

{% block title %}Student Signup{% endblock %}

{% block content %}
<style>
    .signup-container {
        width: 350px;
        background: #fff;
        padding: 40px;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        animation: containerAnim 1s ease-in-out;
        margin: 60px auto; /* Center vertically with some margin from navbar */
    }

    @keyframes containerAnim {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.3s;
    }

    button:hover {
        background: #005bb5;
    }
</style>

<div class="signup-container">
    <h2>Student Signup</h2>
    <form action="/signup" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" id="username" name="username" placeholder="Username" required><br>
        <input type="email" id="email" name="email" placeholder="Email" required><br>
        <input type="password" id="password" name="password" placeholder="Password" required><br>
        <button type="submit">Student Signup</button>
    </form>
    <p>Already have an account? <a href="/login_page">Student Login</a></p>
</div>
{% endblock %}
